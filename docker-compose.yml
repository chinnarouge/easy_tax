services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: steuerhelfer
      POSTGRES_PASSWORD: steuerhelfer
      POSTGRES_DB: steuerhelfer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      sh -c "pip install -e '.[dev]' && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://steuerhelfer:steuerhelfer@db:5432/steuerhelfer

  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    volumes:
      - ./:/workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  pgdata:
